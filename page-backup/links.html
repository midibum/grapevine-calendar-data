<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Eric Coard | Links</title>
<style>
  body {
    margin: 0;
    background: #FDFBF6;
    color: #17201C;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 32px 20px 48px;
  }
  .logo-ws {
    max-width: 320px;
    width: 100%;
    height: auto;
    display: block;
    margin: 0 auto 10px;
  }
  .logo-grapevine {
    max-width: 250px;
    width: 100%;
    height: auto;
    display: block;
    margin: 0 auto 8px;
  }
  .tagline {
    color: #5B6660;
    font-size: 16px;
    margin: 0 0 28px;
  }
  .btn {
    display: block;
    width: 100%;
    box-sizing: border-box;
    padding: 18px 20px;
    margin: 0 0 14px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 700;
    text-decoration: none;
    line-height: 1.3;
  }
  .btn-primary {
    background: #17513F;
    color: #FFFFFF;
  }
  .btn-secondary {
    background: #FFFFFF;
    color: #17513F;
    border: 2px solid #17513F;
  }
  .btn small {
    display: block;
    font-size: 14px;
    font-weight: 400;
    margin-top: 2px;
    opacity: 0.85;
  }
  .phone {
    margin-top: 24px;
    font-size: 16px;
    color: #5B6660;
  }
  .phone a {
    color: #17513F;
    font-weight: 700;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo-ws" src="https://raw.githubusercontent.com/midibum/grapevine-calendar-data/main/photos/5a6060726449.png" alt="Whittington Station Printing &amp; Graphics">
    <img class="logo-grapevine" src="https://raw.githubusercontent.com/midibum/grapevine-calendar-data/main/photos/9b3147ed1471.png" alt="Franklin Southampton Grapevine">
    <p class="tagline">Eric Coard &middot; Franklin &amp; Southampton County, Virginia</p>

    <a class="btn btn-primary" href="https://grapevinecalendar.com/">
      Grapevine Community Calendar
      <small>Discover what&rsquo;s happening locally</small>
    </a>

    <a class="btn btn-secondary" href="https://whittingtonstation.com/">
      Whittington Station Printing &amp; Graphics
      <small>Flyers, banners, menus, cards &amp; more</small>
    </a>

    <p class="phone">Call the shop: <a href="tel:+17572146923">(757) 214-6923</a></p>
  </div>
</body>
</html>
